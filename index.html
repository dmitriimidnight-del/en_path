<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EN Path">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>EN Path — глаголы, времена, конструкции</title>
<style>
:root{--bg:#0c0d12;--bg2:#161821;--bg3:#222536;--line:#262938;--line2:#6f7390;--tx:#e8e8ee;--tx2:#8a8da0;--s:#6ea0ff;--c:#5fd39a;--p:#f0b45a;--pc:#b693f5;--ok:#5fd39a;--bad:#ff7a7a;--nav:58px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
section{display:none;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 28px)}
section.on{display:block}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;border-bottom:1px solid var(--line)}
main{padding:2px 14px 0}
button{font:inherit;font-size:13px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
button.on{color:var(--tx);border-color:var(--line2);background:var(--bg3)}
input{font:inherit;font-size:16px;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-width:0;width:100%}
input:focus{outline:none;border-color:var(--line2)}
select{font:inherit;font-size:13px;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:0 8px;min-width:0}
.sr{display:flex;gap:8px}.sr input{flex:1}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:9px 0;min-width:0}
.cnt{font-size:12px;color:var(--tx2);margin-top:8px}
.tg{font-size:11px;font-weight:400;color:var(--tx2)}
.k1{color:var(--s)}.k2{color:var(--c)}.k3{color:var(--p)}.k4{color:var(--pc)}
.g{font-size:13px;color:var(--tx2);margin-top:3px;line-height:1.4}
.empty{padding:32px 0;color:var(--tx2);font-size:14px}
.empty button{margin-top:12px;color:var(--tx)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(12,13,18,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
nav button{flex:1;height:var(--nav);border:0;border-radius:0;background:none;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
nav button b{font-size:19px;font-weight:400;line-height:1}
nav button.on{color:var(--tx);background:none}
nav button.on b{color:var(--s)}

.row{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .f{font-size:16px;font-weight:600}
.row .f i{font-style:normal;color:var(--tx2);font-weight:400}
.ru{font-size:13px;color:var(--tx2);margin-top:2px;line-height:1.35}
.okm{color:var(--ok);font-size:12px;margin-left:8px;font-weight:400}
.ex{display:none;margin-top:8px;font-size:14px}
.ex .m span{color:var(--tx2);font-size:11px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts button{color:var(--tx)}
.row.o .ex{display:block}
.learn .row:not(.o) .k2,.learn .row:not(.o) .k3{filter:blur(7px)}

.pr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pr button,.fm button{padding:10px 0;font-size:14px}
.pr button{font-family:ui-monospace,Menlo,Consolas,monospace}
.fm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.fm button{font-size:13px;padding:9px 0}
.vb{display:flex;gap:6px;margin-top:8px}
.vchip{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;color:var(--tx);font-size:14px}
.vchip .cr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2);font-size:12px}
.vchip .dn{color:var(--tx2)}
.grp{display:inline-block;margin:20px 0 6px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);font-size:14px}
.tr{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.top{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tr .f{font-size:19px;font-weight:600;white-space:nowrap}
.l{font-size:11px;white-space:nowrap}
.ln{display:flex;gap:10px;align-items:baseline;margin:3px 0}
.ln .t{width:34px;flex:none;font-size:11px;color:var(--tx2)}
.ln .f{font-size:16px}
.mk{font-size:12px;color:var(--tx2);margin-top:4px}
.mk b{color:var(--p);font-weight:400}
.hint{font-size:12px;color:var(--tx2);margin-top:12px}

.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet .hd{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.sheet .ls{flex:1;overflow:auto;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet .row.cur{background:var(--bg2);margin:0 -14px;padding-left:14px;padding-right:14px}

.cf{font-size:16px;font-weight:600}
.prog{font-size:11px;color:var(--tx2);margin-left:8px;font-weight:400;font-family:system-ui,sans-serif}
.prog.done{color:var(--ok)}
.exl{padding:9px 0 2px;border-top:1px dashed var(--line);margin-top:8px;cursor:pointer}
.exl .en{font-size:15px}
.cx{color:var(--pc)}

.card{margin-top:16px;padding:18px 16px;background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.qh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.big{font-size:30px;font-weight:600;line-height:1.1}
.sent{font-size:20px;font-weight:600;margin-top:8px;line-height:1.4}
.sent.ruq{font-weight:500}
.lbl{font-size:12px;color:var(--tx2)}
.ic{font-size:18px;padding:6px 10px}
.fld{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.fld input{font-family:ui-monospace,Menlo,Consolas,monospace}
.fld input.good{border-color:var(--ok);color:var(--ok)}
.fld input.bad{border-color:var(--bad);color:var(--bad)}
.fix{font-size:14px;color:var(--ok);min-height:18px;margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:13px 0;font-size:15px}
button.pri{color:#0c0d12;background:var(--s);border-color:var(--s);font-weight:600}
button.neg{color:var(--bad);border-color:rgba(255,122,122,.45)}
.opts{display:grid;gap:8px;margin-top:16px}
.opts button{text-align:left;padding:13px 12px;font-size:15px;color:var(--tx)}
.opts button.good{border-color:var(--ok);background:rgba(95,211,154,.12)}
.opts button.bad{border-color:var(--bad);background:rgba(255,122,122,.12)}
.opts button:disabled{cursor:default}
.exp{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.exp .f{font-size:17px;font-weight:600;margin-top:6px;line-height:1.4}
.okt{color:var(--ok);font-weight:600}.badt{color:var(--bad);font-weight:600}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--line2);color:var(--tx)}
.fill{color:var(--pc)}
.hn{color:var(--tx2);font-weight:400;font-size:.8em}
.mkh{color:var(--p);background:rgba(240,180,90,.14);border-radius:4px;padding:0 3px}
.formula{display:inline-block;margin-top:10px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--tx2);margin-top:12px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.bar.thin{height:3px;margin-top:6px}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-top:9px}
.day b{color:var(--tx);font-weight:600}
.chipf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--tx2)}
.chipf button{padding:5px 10px;font-size:12px}
.goal{margin-top:10px;color:var(--p);font-weight:600}
.tsg{display:grid;grid-template-columns:44px repeat(4,1fr);gap:4px;margin-top:18px;font-size:12px}
.tsg div{padding:7px 4px;text-align:center;border-radius:6px}
.tsg .h{color:var(--tx2);padding:2px 4px}
.tsg .c{background:var(--bg2);border:1px solid var(--line);font-family:ui-monospace,Menlo,Consolas,monospace}
.tsg .lo{color:var(--bad)}.tsg .hi{color:var(--ok)}
.tsg .off{opacity:.35}
.erow{padding:10px 0;border-bottom:1px solid var(--line)}
.erow .mono{font-size:14px;margin-top:3px}
.badx{color:var(--bad)}.okx{color:var(--ok)}
.wbad{color:var(--bad);text-decoration:underline;text-decoration-thickness:2px}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.plan span{font-size:13px;color:var(--tx2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.plan b{color:var(--tx);font-weight:600}
.tips{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--tx2);line-height:1.5}
.seg .lab{align-self:center;font-size:12px;color:var(--tx2);flex:none;margin-right:2px}
#micb:disabled{opacity:.8}
.ttl{font-size:20px;font-weight:700}
.rsw button{padding:7px 0;font-size:12px}
#qm{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}#qm::-webkit-scrollbar{display:none}
#qm button{flex:none;padding:9px 13px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg3);color:var(--tx);font-size:16px}
.chip.used{visibility:hidden}
.ansz{border-bottom:2px dashed var(--line2);padding:6px 0 10px;min-height:56px;margin-top:14px;align-items:center}
.ansz.good .chip{border-color:var(--ok);color:var(--ok)}.ansz.bad .chip{border-color:var(--bad);color:var(--bad)}
.lrow{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lnum{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx2)}
.lrow.done .lnum{border-color:var(--ok);color:var(--ok)}
.lrow.next .lnum{background:var(--s);border-color:var(--s);color:#0c0d12;font-weight:700}
.lrow .lt{flex:1;min-width:0}
.lst{flex:none;font-size:12px;color:var(--tx2)}.lst.ok{color:var(--ok)}.lst.nx{color:var(--s);font-weight:600}
.theory{font-size:15px;line-height:1.55;margin-top:10px}
.theory b{color:var(--s);font-weight:600}
.tp{border-bottom:1px solid var(--line)}
.tph{display:flex;justify-content:space-between;align-items:center;padding:13px 0;cursor:pointer;font-size:15px}
.tpb{display:none;padding-bottom:12px}.tp.o .tpb{display:block}
.wr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);cursor:pointer}
.wr .en{flex:1;font-weight:600;font-size:15px}
.wr .wru{flex:1;color:var(--tx2);font-size:14px}
.kn{flex:none;padding:5px 9px;font-size:12px}
.kn.on{color:var(--ok);border-color:rgba(95,211,154,.5)}
.wst{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.wst.l1{background:var(--p)}.wst.l3{background:var(--ok)}
.setr{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13px;color:var(--tx2)}
.setr .seg{margin-top:0}
.rs{padding:10px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:start}
.rs.cur{background:rgba(110,160,255,.08);margin:0 -16px;padding-left:16px;padding-right:16px}
.ren{font-size:18px;line-height:1.6}
.rru{display:none;grid-column:1;font-size:14px;color:var(--tx2)}.rs.o .rru{display:block}
.racts{grid-row:1/3;grid-column:2;display:flex;gap:4px}.racts button{padding:5px 8px;font-size:12px}
.tw{cursor:pointer;border-bottom:1px dotted var(--line2)}
.pop{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 10px);z-index:25;background:var(--bg3);border:1px solid var(--line2);border-radius:12px;padding:14px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.pop.on{display:block}
.bars{display:flex;gap:4px;align-items:flex-end;margin-top:14px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--tx2)}
.bw{height:70px;width:100%;display:flex;align-items:flex-end;background:var(--bg);border-radius:4px}
.bw i{display:block;width:100%;background:var(--s);border-radius:4px;min-height:2px}.bw i.full{background:var(--ok)}
.bc.now span{color:var(--tx);font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.sc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 8px;display:flex;flex-direction:column;gap:2px}
.sc b{font-size:18px}.sc span{font-size:11px;color:var(--tx2)}
.onbw{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 4px 40px}
.dots{display:flex;gap:6px}.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--s)}
.onbw .opts button{line-height:1.4}
.chip.sel{background:var(--s);border-color:var(--s);color:#0c0d12}
#gear{padding:8px 12px}
</style>
</head>
<body>

<section id="s-s">
<header>
<div class="sr" style="align-items:center"><div class="ttl" style="flex:1">Сегодня</div><button id="gear">⚙ Настройки</button></div>
<div id="sday"></div>
</header>
<main id="out-s"></main>
</section>

<section id="s-v">
<header>
<div class="seg rsw" style="margin:0 0 8px"><button data-r="v">Глаголы</button><button data-r="t">Времена</button><button data-r="c">Конструкции</button></div>
<div class="sr"><input id="qv" type="search" placeholder="Поиск: go, went, идти" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="lb">Учить</button></div>
<div class="seg"><button id="vt-i">Неправильные</button><button id="vt-r">Правильные</button></div>
<div class="cnt" id="cnt-v"></div>
</header>
<main id="out-v"></main>
</section>

<section id="s-t">
<header>
<div class="seg rsw" style="margin:0 0 8px"><button data-r="v">Глаголы</button><button data-r="t">Времена</button><button data-r="c">Конструкции</button></div>
<div class="pr" id="pr"></div>
<div class="fm" id="fm"></div>
<div class="vb"><button id="vchip" class="vchip"></button><button id="vrnd" title="Случайный глагол">🎲</button></div>
</header>
<main id="out-t"></main>
</section>

<section id="s-c">
<header>
<div class="seg rsw" style="margin:0 0 8px"><button data-r="v">Глаголы</button><button data-r="t">Времена</button><button data-r="c">Конструкции</button></div>
<div class="sr"><input id="qc" type="search" placeholder="Поиск: used to, привык, если бы" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
<div class="cnt" id="cnt-c"></div>
</header>
<main id="out-c"></main>
</section>

<section id="s-l">
<header>
<div class="seg" style="margin-top:0"><button id="lt-b">Основы A1</button><button id="lt-r">Чтение</button></div>
<div class="cnt" id="cnt-l"></div>
</header>
<main id="out-l"></main>
</section>

<section id="s-d">
<header>
<div class="sr"><input id="qd" type="search" placeholder="Поиск: apple, яблоко" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
<div class="seg"><button id="dv-w">Слова</button><button id="dv-p">Фразы</button></div>
<div class="cnt" id="cnt-d"></div>
</header>
<main id="out-d"></main>
</section>

<section id="s-q">
<header>
<div class="seg" id="qm" style="margin-top:0"></div>
<div class="seg" id="qsub"></div>
<div id="qf"></div>
<div id="qday"></div>
</header>
<main id="out-q"></main>
</section>

<div class="sheet" id="sheet">
<div class="hd"><input id="qs" type="search" placeholder="Найти глагол: go, идти" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="xs">✕</button></div>
<div class="ls" id="ls"></div>
</div>

<div class="sheet" id="setsheet">
<div class="hd" style="align-items:center"><div class="ttl" style="flex:1">Настройки</div><button id="xset">✕</button></div>
<div class="ls" id="setls"></div>
</div>
<div class="sheet" id="onb"><div class="ls" id="onbls"></div></div>
<div class="pop" id="pop"></div>

<nav><button data-t="s"><b>◉</b>Сегодня</button><button data-t="l"><b>▤</b>Уроки</button><button data-t="d"><b>Aa</b>Словарь</button><button data-t="r"><b>≡</b>Справочник</button><button data-t="q"><b>✎</b>Тренажёр</button></nav>

<script>

{id:"be2",title:"to be: вопросы и отрицания",d:"Are you ready? — No, I'm not.",
th:"<b>Отрицание</b>: после be ставим <b>not</b>.<br>I am not (I'm not) · he is not (isn't) · they are not (aren't)<br><br><b>Вопрос</b>: be выходит вперёд.<br><b>Are</b> you ready? <b>Is</b> she at work?<br><br><b>Короткий ответ</b>: Yes, I am. / No, she isn't.",
ex:[

{id:"a_an",title:"Артикли a / an",d:"a dog, an apple, an hour",
th:"<b>a / an</b> — «один, какой-то». Ставим перед предметом в единственном числе, когда просто называем его: I have <b>a</b> car. She is <b>a</b> teacher.<br><br><b>an</b> — перед гласным <i>звуком</i>: <b>an</b> apple, <b>an</b> hour (h не читается). Но <b>a</b> university — там звук [ю].<br><br>Профессия — всегда с a/an: He is <b>an</b> engineer.",
ex:[
{t:"choose",s:"I have ___ dog.",o:["a","an","—"],a:"a",ru:"У меня есть собака."},
{t:"choose",s:"It is ___ apple.",o:["a","an","—"],a:"an",ru:"Это яблоко."},
{t:"choose",s:"She is ___ engineer.",o:["a","an","—"],a:"an",ru:"Она инженер."},
{t:"choose",s:"We need ___ hour.",o:["a","an","—"],a:"an",ru:"Нам нужен час."},
{t:"choose",s:"He is ___ doctor.",o:["a","an","—"],a:"a",ru:"Он врач."},
{t:"choose",s:"This is ___ university.",o:["a","an","—"],a:"a",ru:"Это университет."},
{t:"fill",s:"I want ___ orange.",a:["an"],ru:"Я хочу апельсин."},
{t:"tr",ru:"Это книга.",a:["It is a book.","This is a book."]},
{t:"order",a:"My brother is an artist.",ru:"Мой брат — художник."}]},
{id:"the",title:"Артикль the и без артикля",d:"the door, the sun, но London и English",
th:"<b>the</b> — «тот самый», когда понятно, о чём речь: Close <b>the</b> door. I bought a car. <b>The</b> car is red.<br><br>Единственное в своём роде: <b>the</b> sun, <b>the</b> moon.<br><br><b>Без артикля</b>: имена и города (Anna, London), языки (English), и когда говорим «вообще» во множественном числе или о неисчисляемом: I like <b>cats</b>. <b>Water</b> is important.",
ex:[
{t:"choose",s:"Please close ___ door.",o:["a","the","—"],a:"the",ru:"Закрой, пожалуйста, дверь."},
{t:"choose",s:"___ sun is hot.",o:["A","The","—"],a:"The",ru:"Солнце горячее."},
{t:"choose",s:"I live in ___ London.",o:["a","the","—"],a:"—",ru:"Я живу в Лондоне."},

{t:"choose",s:"I like ___ cats.",o:["a","the","—"],a:"—",ru:"Я люблю кошек."},
{t:"choose",s:"I have a car. ___ car is red.",o:["A","The","—"],a:"The",ru:"У меня есть машина. Машина красная."},
{t:"choose",s:"Where is ___ bathroom?",o:["a","the","—"],a:"the",ru:"Где ванная?"},
{t:"order",a:"The children are in the garden.",ru:"Дети в саду."}]},
{id:"plural",title:"Множественное число",d:"books, boxes, cities, children",
th:"Обычно + <b>s</b>: book → book<b>s</b>.<br>После s, x, ch, sh + <b>es</b>: bus → bus<b>es</b>, box → box<b>es</b>, watch → watch<b>es</b>.<br>Согласная + y → <b>ies</b>: city → cit<b>ies</b>. Но гласная + y → просто s: day → day<b>s</b>.<br><br>Особые: man → <b>men</b>, woman → <b>women</b>, child → <b>children</b>, person → <b>people</b>, foot → <b>feet</b>, tooth → <b>teeth</b>.",
ex:[
{t:"fill",s:"two ___",h:"book",a:["books"],ru:"две книги"},
{t:"fill",s:"three ___",h:"box",a:["boxes"],ru:"три коробки"},

{t:"order",a:"There are two buses here.",ru:"Здесь два автобуса."}]},
{id:"pron",title:"Местоимения: I – me – my",d:"she loves him, his name is Tom",
th:"Кто? → кого/кому? → чей?<br>I → <b>me</b> → <b>my</b><br>you → you → <b>your</b><br>he → <b>him</b> → <b>his</b><br>she → <b>her</b> → <b>her</b><br>it → it → <b>its</b><br>we → <b>us</b> → <b>our</b><br>they → <b>them</b> → <b>their</b><br><br><b>She</b> loves <b>him</b>. <b>His</b> name is Tom.",
ex:[
{t:"choose",s:"___ name is Anna.",o:["I","Me","My"],a:"My",ru:"Меня зовут Анна."},
{t:"choose",s:"Can you help ___?",o:["I","me","my"],a:"me",ru:"Можешь мне помочь?"},
{t:"choose",s:"This is Tom. I like ___.",o:["he","him","his"],a:"him",ru:"Это Том. Он мне нравится."},
{t:"choose",s:"Anna and ___ brother are here.",o:["she","her","hers"],a:"her",ru:"Анна и её брат здесь."},
{t:"choose",s:"___ are my friends.",o:["They","Them","Their"],a:"They",ru:"Они мои друзья."},
{t:"choose",s:"Call ___ tomorrow.",o:["we","us","our"],a:"us",ru:"Позвони нам завтра."},
{t:"fill",s:"We love ___ city.",h:"наш",a:["our"],ru:"Мы любим наш город."},
{t:"fill",s:"They live with ___ parents.",h:"их",a:["their"],ru:"Они живут со своими родителями."},
{t:"tr",ru:"Это моя машина.",a:["This is my car.","It is my car."]}]},
{id:"this",title:"this / that / these / those",d:"этот, тот, эти, те",
th:"<b>this</b> — этот (рядом), <b>that</b> — тот (далеко).<br>Во множественном: <b>these</b> — эти, <b>those</b> — те.<br><br>This is my phone. That house is old.<br>These apples are sweet. Those people are tourists.",
ex:[
{t:"choose",s:"___ is my bag.",h:"рядом",o:["This","These","Those"],a:"This",ru:"Это моя сумка."},
{t:"choose",s:"___ shoes are new.",h:"рядом",o:["This","That","These"],a:"These",ru:"Эти туфли новые."},
{t:"choose",s:"Look at ___ mountain!",h:"далеко",o:["this","that","those"],a:"that",ru:"Посмотри на ту гору!"},
{t:"choose",s:"___ people are my neighbours.",h:"далеко",o:["That","These","Those"],a:"Those",ru:"Те люди — мои соседи."},
{t:"fill",s:"Is ___ your coffee?",h:"рядом",a:["this"],ru:"Это твой кофе?"},
{t:"order",a:"These books are very interesting.",ru:"Эти книги очень интересные."},
{t:"tr",ru:"Тот дом большой.",a:["That house is big."]}]},
{id:"have",title:"have / has — «у меня есть»",d:"I have a car. She has two children.",
th:"«У меня есть» по-английски — <b>I have</b>: I have a car.<br>he / she / it → <b>has</b>: She <b>has</b> two children.<br><br>Вопрос и отрицание — через do / does:<br><b>Do</b> you have a pen? He <b>doesn't have</b> a car.<br><br>В британском есть ещё have got: I've got a car.",
ex:[
{t:"fill",s:"I ___ a brother.",a:["have"],ru:"У меня есть брат."},
{t:"fill",s:"She ___ a new phone.",a:["has"],ru:"У неё новый телефон."},
{t:"choose",s:"___ you have a pen?",o:["Do","Does","Are"],a:"Do",ru:"У тебя есть ручка?"},
{t:"choose",s:"He doesn't ___ a car.",o:["have","has","having"],a:"have",ru:"У него нет машины."},
{t:"choose",s:"My city ___ a beautiful park.",o:["have","has","is"],a:"has",ru:"В моём городе есть красивый парк."},
{t:"order",a:"We have two cats.",ru:"У нас две кошки."},
{t:"tr",ru:"У неё есть сестра.",a:["She has a sister.","She has got a sister."]},
{t:"tr",ru:"У тебя есть время?",a:["Do you have time?","Have you got time?"]}]},
{id:"ps",title:"Present Simple: he / she / it + s",d:"She works. Does he live here?",
th:"Present Simple — то, что бывает регулярно: I work. You live here.<br><br>С <b>he / she / it</b> к глаголу добавляем <b>-s</b>: He work<b>s</b>. She live<b>s</b>.<br>go → go<b>es</b>, watch → watch<b>es</b>, study → stud<b>ies</b>, have → <b>has</b>.<br><br>Вопрос: <b>Do</b> you…? / <b>Does</b> he…? — после does глагол <b>без -s</b>: Does she work?<br>Отрицание: I <b>don't</b> work. She <b>doesn't</b> work.",
ex:[
{t:"fill",s:"She ___ in a bank.",h:"work",a:["works"],ru:"Она работает в банке."},
{t:"fill",s:"My father ___ to work by bus.",h:"go",a:["goes"],ru:"Мой папа ездит на работу на автобусе."},
{t:"fill",s:"He ___ English at school.",h:"study",a:["studies"],ru:"Он учит английский в школе."},
{t:"choose",s:"___ she like coffee?",o:["Do","Does","Is"],a:"Does",ru:"Она любит кофе?"},
{t:"choose",s:"Does he ___ here?",o:["live","lives","living"],a:"live",ru:"Он здесь живёт?"},
{t:"choose",s:"I ___ eat meat.",o:["don't","doesn't","not"],a:"don't",ru:"Я не ем мясо."},
{t:"fill",s:"Tom ___ TV.",h:"not / watch",a:["doesn't watch"],ru:"Том не смотрит телевизор."},
{t:"order",a:"She drinks tea every morning.",ru:"Она пьёт чай каждое утро."},
{t:"tr",ru:"Где ты живёшь?",a:["Where do you live?"]}]},
{id:"order",title:"Порядок слов",d:"кто → что делает → что → где → когда",
th:"Порядок слов в английском строгий:<br><b>кто → что делает → что / кого → где → когда</b><br>I read books at home in the evening.<br><br>Подлежащее нужно всегда, даже если в русском его нет:<br>«Холодно» → <b>It</b> is cold. «Идёт дождь» → <b>It</b> is raining.<br><br>Слова частоты (always, often, never) — <b>перед</b> глаголом: I <b>often</b> cook. Но <b>после</b> be: She is <b>always</b> late.",
ex:[
{t:"order",a:"I read books at home in the evening.",ru:"Вечером дома я читаю книги."},
{t:"order",a:"She often cooks dinner.",ru:"Она часто готовит ужин."},
{t:"order",a:"He is always late.",ru:"Он всегда опаздывает."},
{t:"order",a:"It is very cold today.",ru:"Сегодня очень холодно."},

{t:"choose",s:"___ is raining.",o:["It","—","There"],a:"It",ru:"Идёт дождь."},
{t:"tr",ru:"Я никогда не пью кофе.",a:["I never drink coffee."]}]},
{id:"qw",title:"Вопросительные слова",d:"what, where, when, who, why, how",
th:"<b>what</b> — что, какой · <b>where</b> — где, куда · <b>when</b> — когда<br><b>who</b> — кто · <b>why</b> — почему · <b>how</b> — как<br><b>how much</b> — сколько (стоит; то, что не считается)<br><b>how many</b> — сколько (штук) · <b>how old</b> — сколько лет<br><br>Схема: <b>вопросительное слово + do / does / am / is / are + кто + глагол</b><br>Where <b>do</b> you live? What <b>is</b> your name?",
ex:[
{t:"choose",s:"___ is your name?",o:["What","Where","Who"],a:"What",ru:"Как тебя зовут?"},
{t:"choose",s:"___ do you live?",o:["When","Where","Why"],a:"Where",ru:"Где ты живёшь?"},

{t:"choose",s:"How ___ brothers do you have?",o:["much","many","old"],a:"many",ru:"Сколько у тебя братьев?"},
{t:"choose",s:"___ are you sad?",o:["Why","Who","Where"],a:"Why",ru:"Почему ты грустный?"},
{t:"order",a:"When does the shop open?",ru:"Когда открывается магазин?"},
{t:"order",a:"How old are you?",ru:"Сколько тебе лет?"},
{t:"tr",ru:"Что ты делаешь?",a:["What are you doing?"]}]},
{id:"time",title:"in / on / at — время",d:"at 5 o'clock, on Monday, in July",
th:"<b>at</b> — точное время: at 5 o'clock, at noon, at night<br><b>on</b> — дни и даты: on Monday, on 5 May, on my birthday<br><b>in</b> — месяцы, годы, времена года, части дня: in July, in 2020, in summer, in the morning<br><br><b>Без предлога</b>: today, tomorrow, yesterday, every day, next week, last year.",
ex:[

{t:"choose",s:"The shop is closed ___ night.",o:["in","on","at"],a:"at",ru:"Ночью магазин закрыт."},

{t:"order",a:"The lesson starts at nine.",ru:"Урок начинается в девять."}]},
{id:"place",title:"Предлоги места",d:"in the box, on the table, at home",
th:"<b>in</b> — внутри: in the box, in the room, in Almaty<br><b>on</b> — на поверхности: on the table, on the wall<br><b>at</b> — в точке, у места: at home, at work, at school, at the bus stop<br><br><b>under</b> — под · <b>next to</b> — рядом с · <b>between</b> — между · <b>behind</b> — за · <b>in front of</b> — перед",

{t:"choose",s:"There is a picture ___ the wall.",o:["in","on","at"],a:"on",ru:"На стене картина."},
{t:"order",a:"My phone is in my bag.",ru:"Мой телефон в сумке."},
{t:"tr",ru:"Я дома.",a:["I am at home."]}]},
{id:"some",title:"some / any, much / many",d:"some money, any questions, many people",
th:"<b>some</b> — немного, несколько (в утверждении): I have some money.<br><b>any</b> — в вопросах и отрицаниях: Do you have any questions? I don't have any time.<br><br><b>many</b> — много того, что можно посчитать (books, people)<br><b>much</b> — много того, что не считается (water, time, money)<br>В утверждении проще сказать <b>a lot of</b>: I have a lot of friends.",
ex:[
{t:"choose",s:"I have ___ friends in London.",o:["some","any","much"],a:"some",ru:"У меня есть несколько друзей в Лондоне."},
{t:"choose",s:"Do you have ___ questions?",o:["some","any","many"],a:"any",ru:"У вас есть вопросы?"},

{t:"order",a:"We have a lot of work today.",ru:"Сегодня у нас много работы."}]}
];

var NAMES=['I','Tom','Anna','London','Almaty','Kazakhstan','English','Monday','Sundays','July','Alex','Russian','Wi-Fi'];

return w;
}

}

function gloss(raw,tx){
var k=raw.toLowerCase().replace(/[’]/g,"'").replace(/^[^a-zа-яё]+|[^a-zа-яё]+$/gi,'');
if(!k)return null;
var g=(tx&&tx.g)||{};
if(g[k])return {en:k,ru:g[k]};

if(BY[k])return {en:k,ru:BY[k].ru};
for(var i=0;i<IRR.length;i++){var x=IRR[i];
if(x.p2.split('/').indexOf(k)>-1)return {en:k,ru:x.ru+' — прошедшее время от '+x.v};

var c=[k.replace(/ies$/,'y'),k.replace(/es$/,''),k.replace(/s$/,''),k.replace(/ied$/,'y'),k.replace(/ed$/,''),k.replace(/d$/,''),k.replace(/ing$/,''),k.replace(/ing$/,'e')];
for(var j=0;j<c.length;j++){if(c[j]==k)continue;if(WENB[c[j]])return {en:k,ru:WENB[c[j]].ru+' ('+c[j]+')',id:WENB[c[j]].id};if(BY[c[j]])return {en:k,ru:BY[c[j]].ru+' ('+c[j]+')'}}
return null;
}

function words(s){return expand(s)[0].split(' ').filter(Boolean)}
function lcsT(a,b){var d=[],i,j;for(i=0;i<=a.length;i++){d[i]=[];for(j=0;j<=b.length;j++)d[i][j]=i&&j?(a[i-1]==b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1])):0}return d}
function sim(x,y){var a=words(x),b=words(y);if(!a.length||!b.length)return 0;return 2*lcsT(a,b)[a.length][b.length]/(a.length+b.length)}
function diffH(correct,inp){
var raw=correct.split(' '),a=raw.map(function(w){return norm(w)}),b=norm(inp).split(' ').filter(Boolean),d=lcsT(a,b),hit={},i=a.length,j=b.length;
while(i&&j){if(a[i-1]==b[j-1]){hit[i-1]=1;i--;j--}else if(d[i-1][j]>=d[i][j-1])i--;else j--}
return raw.map(function(w,k){return hit[k]||!a[k]?esc(w):'<span class="wbad">'+esc(w)+'</span>'}).join(' ');
}

var x=Q.x,a2=E('a2'),a3=E('a3');
if(!give&&!a2.value.trim()&&!a3.value.trim()){a2.focus();return}
var okA=function(inp,ans){var al=ans.toLowerCase().split('/'),ps=norm(inp.replace(/,/g,' ')).split(/[\s\/]+/).filter(Boolean);return ps.length>0&&ps.every(function(p){return al.indexOf(p)>-1})};
var o2=!give&&okA(a2.value,x.p2),o3=!give&&okA(a3.value,x.p3),ok=o2&&o3,was=learned(x.v);
[[a2,o2,'f2',x.p2],[a3,o3,'f3',x.p3]].forEach(function(z){z[0].classList.add(z[1]?'good':'bad');z[0].readOnly=true;z[0].blur();E(z[2]).textContent=z[1]?'':'→ '+z[3]});

markDone();sayForms(x);

var inp=E('ans');if(!inp)return;var v=inp.value;
if(!give&&!v.trim()){inp.focus();return}

if(Q.m=='c'||Q.m=='w'||Q.m=='l')grade(Q.m,Q.id,ok);else if(Q.m=='t')tsAdd(Q.ti,ok);
after(ok,give?'не знаю':v.trim());
var head='<span class="'+(ok?'okt':'badt')+'">'+(ok?'Верно!':(give?'Ответ:':'Правильно:'))+'</span>',body='';
if(Q.m=='w'){body='<div class="f">'+esc(Q.wd.en)+' — <span style="color:var(--tx2);font-weight:400">'+esc(Q.wd.ru)+'</span></div>'}

else if(Q.m=='c'){var e=Q.e;body='<div class="f">'+sentH(e.s,{fill:e.a[0]})+'</div><div class="formula mono">'+fml(e.c.f)+'</div><div class="g">'+esc(e.c.ru)+'. '+esc(e.c.n)+'</div>'}
else if(Q.m=='d'){body='<div class="f">'+(ok||give?esc(Q.full):diffH(Q.full,v))+'</div><div class="g">'+esc(Q.s.ru)+'</div>'+(ok||give?'':'<div class="g">Красным — слова, которые ты пропустил или написал иначе.</div>')}
else if(Q.sub=='mark'){var it=Q.it,mk=it.m.length?it.m:[it.mh];body='<div class="f">'+sentH(it.s,{fill:it.a[0],mk:it.m})+'</div><div class="g">Маркер «'+esc(mk.join(' … '))+'» → <b style="color:'+KD[it.t&3][1]+'">'+tname(it.t)+'</b>: '+G.a[it.t]+'.</div>'}
else{var b=build(Q.f,Q.i,Q.p,Q.x.v);body='<div class="f mono">'+fh(b,KD[Q.i&3][1],tag(Q.f,Q.i,Q.p,Q.x.v))+'</div><div class="g">'+tname(Q.i)+' — '+gl(Q.f,Q.i,Q.x.v)+'</div>'}
if(!ok&&!give)body+='<div class="g">Твой ответ: <span class="mono" style="color:var(--bad)">'+esc(v)+'</span></div>';
E('res').innerHTML='<div class="exp">'+head+body+fixedLine()+goalLine()+'</div>';
markDone();say(Q.full);
}
function gradeCard(ok){
if(Q.done||!Q.shown)return;
if(Q.m=='say'){after(ok,ok?'':'не получилось');Q.res='<div class="exp"><span class="'+(ok?'okt':'badt')+'">'+(ok?'Отлично!':'Повтори вслух ещё пару раз:')+'</span><div class="f">'+esc(Q.full)+'</div>'+goalLine()+'</div>';drawQ();return}
var was=isLearned(Q.id);grade(Q.m,Q.id,ok);after(ok,ok?'':'не вспомнил');
Q.res='<div class="exp" style="border:0;padding-top:0;margin-top:10px"><span class="'+(ok?'okt':'badt')+'">'+(ok?(!was&&isLearned(Q.id)?'Отлично! Карточка выучена ✓':'Отлично!'):'Вернётся через пару заданий.')+'</span>'+fixedLine()+goalLine()+'</div>';
drawQ();
}
function showCard(){if(Q.shown)return;Q.shown=1;drawQ();if(Q.m=='f')sayForms(Q.x);else say(Q.full)}
function answerT(j){
if(Q.done)return;
var ok=j==Q.i,x=Q.x,b=build(Q.f,Q.i,Q.p,x.v);
[].forEach.call(OUT().querySelectorAll('[data-j]'),function(el){var k=+el.getAttribute('data-j');if(k==Q.i)el.classList.add('good');else if(k==j)el.classList.add('bad');el.disabled=true});
tsAdd(Q.i,ok);after(ok,Q.type=='A'?tname(j):plain(build(Q.f,j,Q.p,x.v)));
var alsoSame=Q.same.filter(function(k){return k!=Q.i});
E('res').innerHTML='<div class="exp"><span class="'+(ok?'okt':'badt')+'">'+(ok?'Верно!':'Не совсем.')+'</span>'+
'<div class="f mono">'+fh(b,KD[Q.i&3][1],tag(Q.f,Q.i,Q.p,x.v))+'</div>'+
'<div class="g">'+tname(Q.i)+' — '+gl(Q.f,Q.i,x.v)+'</div>'+
(alsoSame.length?'<div class="g">С этим глаголом точно так же выглядит '+alsoSame.map(tname).join(', ')+' — различай по контексту.</div>':'')+
fixedLine()+goalLine()+'</div><div class="btns"><button id="next" class="pri">Дальше →</button></div>';
E('qst').innerHTML=footHTML();
say(plain(b));
}
function answerO(k){
if(Q.done)return;
var pick=Q.opts[k],ok=pick==Q.ans;Q.picked=pick;
grade(Q.m,Q.id,ok);after(ok,pick);
if(Q.m=='w')Q.res='<div class="exp"><span class="'+(ok?'okt':'badt')+'">'+(ok?'Верно!':'Не совсем.')+'</span><div class="f">'+esc(Q.wd.en)+' — <span style="color:var(--tx2);font-weight:400">'+esc(Q.wd.ru)+'</span></div>'+fixedLine()+goalLine()+'</div>';
else Q.res='<div class="exp"><span class="'+(ok?'okt':'badt')+'">'+(ok?'Верно!':'Правильно:')+'</span><div class="f">'+esc(Q.full)+'</div><div class="ru">'+esc(Q.ex.ru)+'</div>'+fixedLine()+goalLine()+'</div>';
drawQ();say(Q.full);
}
function doMic(){
var b=E('micb');if(b){b.textContent='🎙 Слушаю… говори';b.disabled=true}
Q.merr='';
listen(function(alts,err){
if(err){Q.merr=micErr(err);drawQ();return}
var best=alts[0],ok=false;
for(var i=0;i<alts.length;i++)if(sameAns(alts[i],Q.answers)||sim(alts[i],Q.full)>=.85){ok=true;best=alts[i];break}
Q.heard=best;
var first=!Q.done;
if(first){if(Q.m=='p')grade('p',Q.id,ok);after(ok,best)}
Q.res='<div class="exp"><span class="'+(ok?'okt':'badt')+'">'+(ok?'Отлично, тебя понятно!':'Не совсем. Послушай и повтори:')+'</span><div class="f">'+(ok?esc(Q.full):diffH(Q.full,best))+'</div>'+(first?goalLine():'')+'</div>';
drawQ();
if(!ok)say(Q.full);
});
}
function doIntro(){
var t=today();
if(!st.srs[Q.id]){st.srs[Q.id]={b:0,d:t};nt(Q.m).n++}
if(Q.ses)SS.plan.splice(Math.min(SS.i+4,SS.plan.length),0,retrySpec());
save();Q.done=1;nextQ();
}
function focusIn(){var a=E('a2')||E('ans');if(a)a.focus()}
function nextQ(){
if(Q&&Q.ses){advance();window.scrollTo(0,0);return}
if(Q&&Q.les){lesAdvance();window.scrollTo(0,0);return}
newQ();drawQ();window.scrollTo(0,0);focusIn();
}

function qClick(e){
var b=e.target.closest('button');if(!b)return;
var a=b.getAttribute('data-a');
if(a=='start'||a=='again'){startSession();return}
if(a=='endses'){SS.over=1;Q=null;drawSummary();return}
if(a=='toerr'){st.qm='e';TQ=null;go('q');return}
if(a=='lback'||a=='lexit'){LV=null;Q=null;LQ=null;renderL();window.scrollTo(0,0);return}
if(a=='lstart'){lesStart();return}
if(a=='lagain'){LV={id:LV.id,step:'th'};lesStart();return}
if(a=='lopen'){st.lt='b';openLesson(b.getAttribute('data-l'));return}
if(a=='ropen'){openText(b.getAttribute('data-r'));return}
if(b.hasAttribute('data-cfg')){setCfg(b.getAttribute('data-cfg'),+b.getAttribute('data-v'));return}
if(a=='exp'){exportData();return}
if(a=='imp'){var f=E('impf');if(f){f.value='';f.click()}return}
if(!Q)return;
if(b.hasAttribute('data-pt')){if(!Q.done){Q.pick.push(+b.getAttribute('data-pt'));drawQ()}return}
if(b.hasAttribute('data-pk')){if(!Q.done){Q.pick.splice(+b.getAttribute('data-pk'),1);drawQ()}return}
if(a=='oclr'){Q.pick=[];drawQ();return}
if(b.hasAttribute('data-o')){answerO(+b.getAttribute('data-o'));return}
if(a=='kn1'){st.srs[Q.id]={b:3,d:today()+7,k:1};save();Q.done=1;nextQ();return}
if(b.id=='chk'){if(Q.done)nextQ();else checkQ(false)}
else if(b.id=='skip')checkQ(true);
else if(b.id=='next')nextQ();
else if(b.hasAttribute('data-j'))answerT(+b.getAttribute('data-j'));
else if(b.hasAttribute('data-g'))gradeCard(b.getAttribute('data-g')=='1');
else if(a=='show')showCard();
else if(a=='intro')doIntro();
else if(a=='mic')doMic();
else if(a=='skipsay'){after(false,'не знаю');Q.res='<div class="exp"><span class="badt">Ответ:</span><div class="f">'+esc(Q.full)+'</div><div class="g">Послушай и повтори вслух, потом нажми «Ещё раз».</div></div>';drawQ();say(Q.full)}
else if(a=='play')say(Q.full);
else if(a=='slow'){if(TTS){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(Q.full);u.lang='en-US';u.rate=.55;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(err){}}}
else if(a=='sayv'){if(Q.done||Q.shown)sayForms(Q.x);else say(Q.x.v)}
else if(a=='sayc')say(Q.full);
else if(a=='hint'){
Q.hint=1;
if((Q.m=='c'&&Q.sub=='card')||Q.m=='say'){drawQ();return}
var hEl=E('hint');if(hEl)hEl.innerHTML=Q.m=='c'?'<div class="formula mono">'+fml(Q.e.c.f)+'</div>':'<div class="formula" style="color:'+KD[Q.ti&3][1]+'">'+tname(Q.ti)+'</div>';
b.style.display='none';focusIn();
}
else if(a=='more'){nt(Q.m).lim+=10;save();Q=null;renderQ()}
else if(a=='free'){ses.free[Q.m]=1;Q=null;renderQ()}
else if(a=='unfree'){ses.free[Q.m]=0;Q=null;renderQ()}
}
function qKey(e){
if(e.key!='Enter'||!Q||Q.done)return;
var id=e.target.id;
if(id=='a2'){e.preventDefault();e.stopPropagation();E('a3').focus()}
else if(id=='a3'||id=='ans'){e.preventDefault();e.stopPropagation();checkQ(false)}
}
['#out-q','#out-s','#out-l'].forEach(function(s){$(s).addEventListener('click',qClick);$(s).addEventListener('keydown',qKey)});
document.addEventListener('keydown',function(e){
if((st.tab!='q'&&st.tab!='s'&&st.tab!='l')||!Q||sheet.classList.contains('on'))return;
if(e.target.tagName=='INPUT'&&!e.target.readOnly)return;
if(e.target.tagName=='SELECT'||e.target.tagName=='BUTTON'&&e.key==' ')return;
var card='fcwp'.indexOf(Q.m)>-1&&Q.sub=='card'&&Q.id&&!Q.intro;
if(Q.intro&&e.key=='Enter'){e.preventDefault();doIntro()}
else if(Q.done&&e.key=='Enter'){e.preventDefault();nextQ()}
else if(card&&!Q.shown&&e.key=='Enter'){e.preventDefault();showCard()}
else if(card&&Q.shown&&!Q.done&&(e.key=='1'||e.key=='2'))gradeCard(e.key=='2');
else if(!Q.done&&Q.m=='t'&&Q.sub=='choose'&&/^[1-4]$/.test(e.key))answerT(Q.opts[+e.key-1]);
else if(!Q.done&&Q.opts&&Q.sub=='choose'&&(Q.m=='w'||Q.m=='l')&&/^[1-4]$/.test(e.key)&&+e.key<=Q.opts.length)answerO(+e.key-1);
});

/* =========== СЕГОДНЯ: занятие =========== */
function kindOf(x){return x.m}
function interleave(a){
shuffle(a);
for(var r=0;r<3;r++)for(var i=1;i<a.length;i++)if(kindOf(a[i])==kindOf(a[i-1]))for(var j=i+1;j<a.length;j++)if(kindOf(a[j])!=kindOf(a[i-1])){var t=a[i];a[i]=a[j];a[j]=t;break}
return a;
}
function buildPlan(){
var t=today(),plan=[],sv=[ses.cf,ses.wf,ses.pf];ses.cf=ses.wf=ses.pf=null;
var dueIds=function(d){return shuffle(deckIds(d).filter(function(id){var r=st.srs[id];return r&&r.d<=t}))};
var due=[].concat(
dueIds('l').slice(0,2).map(function(id){return {m:'l',id:id}}),
dueIds('w').slice(0,3).map(function(id){return {m:'w',sub:['choose','choose','type','card'][rnd(4)],id:id}}),
dueIds('f').slice(0,2).map(function(id){return {m:'f',sub:'type',id:id}}),
dueIds('c').slice(0,2).map(function(id){return {m:'c',sub:'fill',id:id}}),
dueIds('p').slice(0,2).map(function(id){return {m:'p',sub:SRC?'say':'card',id:id}}));
plan=shuffle(due).slice(0,5);
var fresh=function(d,n){var o=nt(d);return deckIds(d).filter(function(id){return !st.srs[id]}).slice(0,Math.max(0,Math.min(n,o.lim-o.n)))};
fresh('w',2).forEach(function(id){plan.push({m:'w',id:id,intro:1})});
fresh('p',1).forEach(function(id){plan.push({m:'p',id:id,intro:1})});
var alt=t%2?'c':'f';fresh(alt,1).forEach(function(id){plan.push({m:alt,id:id,intro:1})});
ses.cf=sv[0];ses.wf=sv[1];ses.pf=sv[2];
var dueKeys={};plan.forEach(function(p){if(p.id)dueKeys[p.id]=1});
st.err.filter(function(e){return errSpec(e)&&!(e.ref&&e.ref.id&&dueKeys[e.ref.id])&&!(e.kind=='f'&&dueKeys['f:'+e.ref.v])}).sort(function(a,b){return a.d-b.d}).slice(0,2).forEach(function(e){plan.push({m:'e',key:e.key})});
var op=shuffle(orderPool().slice());op.slice(0,2).forEach(function(s){plan.push({m:'o',s:s.key})});
plan.push({m:'t',sub:'mark'});plan.push({m:'t',sub:Math.random()<.5?'type':'choose'});
var sp=sentPool();
if(TTS)plan.push({m:'d',s:sp[rnd(sp.length)].key});
var seenS=sp.filter(function(s){return st.srs[s.key]}),src=seenS.length>=3?seenS:sp;
plan.push({m:'say',s:src[rnd(src.length)].key});
while(plan.length<12)plan.push(Math.random()<.5?{m:'o',s:op[rnd(op.length)].key}:{m:'t',sub:['mark','type','choose'][rnd(3)]});
plan=interleave(plan);
var intros=plan.filter(function(p){return p.intro}),rest=plan.filter(function(p){return !p.intro}),out=[];
while(intros.length||rest.length){if(intros.length)out.push(intros.shift());if(rest.length)out.push(rest.shift());if(!intros.length){out=out.concat(rest);rest=[]}}
return out;
}
function startSession(){SS={plan:SPEND||buildPlan(),i:-1,ok:0,all:0,added:0};SPEND=null;advance()}
function advance(){
while(++SS.i<SS.plan.length){var q=makeQ(SS.plan[SS.i]);if(q&&!((q.m=='f'||q.m=='c'||q.m=='w'||q.m=='p')&&!q.id)){q.ses=1;Q=q;drawQ();if(Q.m=='d')say(Q.full);focusIn();return}}
SS.over=1;Q=null;drawSummary();
}
function drawSummary(){
var n=dayN(),s=streakNow();
$('#out-s').innerHTML='<div class="card"><div class="big">Занятие закончено 🎉</div><div class="g" style="margin-top:10px">Верно: <b style="color:var(--tx)">'+SS.ok+' из '+SS.all+'</b>.<br>'+
(SS.added?'Новых ошибок в журнале: '+SS.added+'. Они вернутся в следующих занятиях, пока не закрепятся.':'Новых ошибок нет — отлично!')+'<br>Сегодня: '+n+' из '+GOAL+(n>=GOAL?' ✓':'')+' · 🔥 '+s+' '+plural(s,DW)+' подряд.</div>'+
'<div class="btns">'+(st.err.length?'<button data-a="toerr">Разобрать ошибки</button>':'')+'<button data-a="again" class="pri">Ещё занятие</button></div></div>'+(function(){var nl=nextLesson(),nx=nextText(),h='';if(nl)h+='<div class="card"><div class="qh"><div><div class="lbl">Дальше можно: урок</div><div class="cf" style="margin-top:4px">'+esc(nl.title)+'</div></div><button data-a="lopen" data-l="'+nl.id+'">Открыть →</button></div></div>';if(nx)h+='<div class="card"><div class="qh"><div><div class="lbl">или почитать</div><div class="cf" style="margin-top:4px">'+esc(nx.t)+'</div></div><button data-a="ropen" data-r="'+nx.id+'">Читать →</button></div></div>';return h})();
}
function renderS(){
$('#gear').textContent=(st.level=='B1'?'B1+':st.level)+' · ⚙ Настройки';
drawDay();
if(SS&&!SS.over&&Q&&Q.ses){drawQ();return}
if(SS&&SS.over){drawSummary();return}
var p=SPEND=buildPlan(),c={rv:0,nw:0,e:0,t:0,d:0,say:0,o:0};
p.forEach(function(x){if('fcwpl'.indexOf(x.m)>-1)c[x.intro?'nw':'rv']++;else c[x.m]++});
var items=[['🔁','повторить',c.rv],['✨','новое',c.nw],['⚠️','ошибки',c.e],['🧩','собери фразу',c.o],['◷','времена',c.t],['🎧','диктант',c.d],['🎤','говорение',c.say]].filter(function(x){return x[2]});
var h='<div class="card"><div class="lbl">'+(dayN()>=GOAL?'Цель на сегодня выполнена ✓ — можно ещё':'Занятие на сегодня · примерно 10 минут')+'</div><div class="big" style="margin-top:6px">'+p.length+' '+plural(p.length,['задание','задания','заданий'])+'</div>'+
'<div class="plan">'+items.map(function(x){return '<span>'+x[0]+' '+x[1]+': <b>'+x[2]+'</b></span>'}).join('')+'</div>'+
'<div class="btns"><button data-a="start" class="pri">▶ Начать</button></div></div>';
var nl=nextLesson();if(nl)h+='<div class="card"><div class="qh"><div><div class="lbl">Следующий урок · '+(nl.n+1)+' из '+LS.length+'</div><div class="sent" style="margin-top:4px;font-size:18px">'+esc(nl.title)+'</div><div class="ru">'+esc(nl.d)+'</div></div><button data-a="lopen" data-l="'+nl.id+'">Открыть →</button></div></div>';
if(st.err.length)h+='<div class="card"><div class="qh"><div><div class="lbl">Журнал ошибок</div><div class="sent" style="margin-top:4px">'+st.err.length+' '+plural(st.err.length,['задание','задания','заданий'])+'</div></div><button data-a="toerr">Разобрать →</button></div></div>';
var nt2=nextText();if(nt2)h+='<div class="card"><div class="qh"><div><div class="lbl">Почитай · текст '+(nt2.n+1)+' из '+RT.length+'</div><div class="sent" style="margin-top:4px;font-size:18px">'+esc(nt2.t)+'</div><div class="ru">'+esc(nt2.d)+'</div></div><button data-a="ropen" data-r="'+nt2.id+'">Читать →</button></div></div>';
h+=statsHTML();
h+='<div class="card"><div class="lbl">Как заниматься</div><ul class="tips"><li>Произноси каждый ответ вслух — даже когда печатаешь.</li><li>Лучше 10 минут каждый день, чем час раз в неделю.</li><li>Ошибки — это нормально: они попадают в журнал и возвращаются, пока не закрепятся.</li><li>Слушай английский каждый день: 10–15 минут простых видео или подкастов для начинающих.</li><li>Раз в неделю сохраняй резервную копию в ⚙ Настройках.</li></ul></div>';
$('#out-s').innerHTML=h;
}

go(st.tab);
if(!st.onb)showOnb(0);

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
