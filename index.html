<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EN Path">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>EN Path — глаголы, времена, конструкции</title>
<style>
:root{--bg:#0c0d12;--bg2:#161821;--bg3:#222536;--line:#262938;--line2:#6f7390;--tx:#e8e8ee;--tx2:#8a8da0;--s:#6ea0ff;--c:#5fd39a;--p:#f0b45a;--pc:#b693f5;--ok:#5fd39a;--bad:#ff7a7a;--nav:58px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
section{display:none;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 28px)}
section.on{display:block}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;border-bottom:1px solid var(--line)}
main{padding:2px 14px 0}
button{font:inherit;font-size:13px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
button.on{color:var(--tx);border-color:var(--line2);background:var(--bg3)}
input{font:inherit;font-size:16px;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-width:0;width:100%}
input:focus{outline:none;border-color:var(--line2)}
select{font:inherit;font-size:13px;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:0 8px;min-width:0}
.sr{display:flex;gap:8px}.sr input{flex:1}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:9px 0;min-width:0}
.cnt{font-size:12px;color:var(--tx2);margin-top:8px}
.tg{font-size:11px;font-weight:400;color:var(--tx2)}
.k1{color:var(--s)}.k2{color:var(--c)}.k3{color:var(--p)}.k4{color:var(--pc)}
.g{font-size:13px;color:var(--tx2);margin-top:3px;line-height:1.4}
.empty{padding:32px 0;color:var(--tx2);font-size:14px}
.empty button{margin-top:12px;color:var(--tx)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(12,13,18,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
nav button{flex:1;height:var(--nav);border:0;border-radius:0;background:none;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
nav button b{font-size:19px;font-weight:400;line-height:1}
nav button.on{color:var(--tx);background:none}
nav button.on b{color:var(--s)}

.row{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .f{font-size:16px;font-weight:600}
.row .f i{font-style:normal;color:var(--tx2);font-weight:400}
.ru{font-size:13px;color:var(--tx2);margin-top:2px;line-height:1.35}
.okm{color:var(--ok);font-size:12px;margin-left:8px;font-weight:400}
.ex{display:none;margin-top:8px;font-size:14px}
.ex .m span{color:var(--tx2);font-size:11px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts button{color:var(--tx)}
.row.o .ex{display:block}
.learn .row:not(.o) .k2,.learn .row:not(.o) .k3{filter:blur(7px)}

.pr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pr button,.fm button{padding:10px 0;font-size:14px}
.pr button{font-family:ui-monospace,Menlo,Consolas,monospace}
.fm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.fm button{font-size:13px;padding:9px 0}
.vb{display:flex;gap:6px;margin-top:8px}
.vchip{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;color:var(--tx);font-size:14px}
.vchip .cr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2);font-size:12px}
.vchip .dn{color:var(--tx2)}
.grp{display:inline-block;margin:20px 0 6px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);font-size:14px}
.tr{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.top{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tr .f{font-size:19px;font-weight:600;white-space:nowrap}
.l{font-size:11px;white-space:nowrap}
.ln{display:flex;gap:10px;align-items:baseline;margin:3px 0}
.ln .t{width:34px;flex:none;font-size:11px;color:var(--tx2)}
.ln .f{font-size:16px}
.mk{font-size:12px;color:var(--tx2);margin-top:4px}
.mk b{color:var(--p);font-weight:400}
.hint{font-size:12px;color:var(--tx2);margin-top:12px}

.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet .hd{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.sheet .ls{flex:1;overflow:auto;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet .row.cur{background:var(--bg2);margin:0 -14px;padding-left:14px;padding-right:14px}

.cf{font-size:16px;font-weight:600}
.prog{font-size:11px;color:var(--tx2);margin-left:8px;font-weight:400;font-family:system-ui,sans-serif}
.prog.done{color:var(--ok)}
.exl{padding:9px 0 2px;border-top:1px dashed var(--line);margin-top:8px;cursor:pointer}
.exl .en{font-size:15px}
.cx{color:var(--pc)}

.card{margin-top:16px;padding:18px 16px;background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.qh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.big{font-size:30px;font-weight:600;line-height:1.1}
.sent{font-size:20px;font-weight:600;margin-top:8px;line-height:1.4}
.sent.ruq{font-weight:500}
.lbl{font-size:12px;color:var(--tx2)}
.ic{font-size:18px;padding:6px 10px}
.fld{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.fld input{font-family:ui-monospace,Menlo,Consolas,monospace}
.fld input.good{border-color:var(--ok);color:var(--ok)}
.fld input.bad{border-color:var(--bad);color:var(--bad)}
.fix{font-size:14px;color:var(--ok);min-height:18px;margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:13px 0;font-size:15px}
button.pri{color:#0c0d12;background:var(--s);border-color:var(--s);font-weight:600}
button.neg{color:var(--bad);border-color:rgba(255,122,122,.45)}
.opts{display:grid;gap:8px;margin-top:16px}
.opts button{text-align:left;padding:13px 12px;font-size:15px;color:var(--tx)}
.opts button.good{border-color:var(--ok);background:rgba(95,211,154,.12)}
.opts button.bad{border-color:var(--bad);background:rgba(255,122,122,.12)}
.opts button:disabled{cursor:default}
.exp{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.exp .f{font-size:17px;font-weight:600;margin-top:6px;line-height:1.4}
.okt{color:var(--ok);font-weight:600}.badt{color:var(--bad);font-weight:600}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--line2);color:var(--tx)}
.fill{color:var(--pc)}
.hn{color:var(--tx2);font-weight:400;font-size:.8em}
.mkh{color:var(--p);background:rgba(240,180,90,.14);border-radius:4px;padding:0 3px}
.formula{display:inline-block;margin-top:10px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--tx2);margin-top:12px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.bar.thin{height:3px;margin-top:6px}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-top:9px}
.day b{color:var(--tx);font-weight:600}
.chipf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--tx2)}
.chipf button{padding:5px 10px;font-size:12px}
.goal{margin-top:10px;color:var(--p);font-weight:600}
.tsg{display:grid;grid-template-columns:44px repeat(4,1fr);gap:4px;margin-top:18px;font-size:12px}
.tsg div{padding:7px 4px;text-align:center;border-radius:6px}
.tsg .h{color:var(--tx2);padding:2px 4px}
.tsg .c{background:var(--bg2);border:1px solid var(--line);font-family:ui-monospace,Menlo,Consolas,monospace}
.tsg .lo{color:var(--bad)}.tsg .hi{color:var(--ok)}
.tsg .off{opacity:.35}
.erow{padding:10px 0;border-bottom:1px solid var(--line)}
.erow .mono{font-size:14px;margin-top:3px}
.badx{color:var(--bad)}.okx{color:var(--ok)}
.wbad{color:var(--bad);text-decoration:underline;text-decoration-thickness:2px}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.plan span{font-size:13px;color:var(--tx2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.plan b{color:var(--tx);font-weight:600}
.tips{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--tx2);line-height:1.5}
.seg .lab{align-self:center;font-size:12px;color:var(--tx2);flex:none;margin-right:2px}
#micb:disabled{opacity:.8}
</style>
</head>

<header>
<div class="seg" id="slv" style="margin-top:0"></div>

</header>
<main id="out-s"></main>
</section>

<section id="s-v">
<header>

</section>

<section id="s-t">

<div class="pr" id="pr"></div>
<div class="fm" id="fm"></div>

<main id="out-t"></main>
</section>

<section id="s-c">
<header>
<div class="sr"><input id="qc" type="search" placeholder="Поиск: used to, привык, если бы" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
<div class="cnt" id="cnt-c"></div>
</header>
<main id="out-c"></main>
</section>

<section id="s-q">
<header>
<div class="seg" id="qm" style="margin-top:0"></div>
<div class="seg" id="qsub"></div>
<div id="qf"></div>
<div id="qday"></div>
</header>
<main id="out-q"></main>

<div class="sheet" id="sheet">

<div class="ls" id="ls"></div>
</div>

function ed(v){if(/e$/.test(v))return v+'d';if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+'ied';if(DBL.indexOf(v)>-1)return v+v.slice(-1)+'ed';return v+'ed'}

function sf(v){if(v=='be')return 'is';if(v=='have')return 'has';if(/(s|x|z|ch|sh|o)$/.test(v))return v+'es';if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+'ies';return v+'s'}
function ing(v){if(v=='be')return 'being';if(/ie$/.test(v))return v.slice(0,-2)+'ying';if(DBL.indexOf(v)>-1)return v+v.slice(-1)+'ing';if(/[^e]e$/.test(v))return v.slice(0,-1)+'ing';return v+'ing'}
function first(s){return s.split('/')[0]}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

/* проверка ответа: регистр, пунктуация, сокращения (don't = do not и т. п.) */
function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?,;:"«»—–-]/g,' ').replace(/\s+/g,' ').trim()}
function expand(s){
s=norm(s).replace(/\b(do|does|did|is|are|was|were|has|have|had|would|should|could|must)nt\b/g,"$1n't").replace(/\bwont\b/g,"won't").replace(/\bcant\b/g,"can't").replace(/\bim\b/g,"i'm").replace(/\bive\b/g,"i've").replace(/\b(you|they)re\b/g,"$1're").replace(/\b(there|that|what|it|let)s\b/g,"$1's");
s=s.replace(/\bwon't\b/g,'will not').replace(/\bshan't\b/g,'shall not').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will');
var out=[s];
if(/'s\b/.test(s))out=[s.replace(/'s\b/g,' is'),s.replace(/'s\b/g,' has')];
if(/'d\b/.test(s))out=out.reduce(function(a,x){return a.concat([x.replace(/'d\b/g,' had'),x.replace(/'d\b/g,' would')])},[]);
return out.map(function(x){return x.replace(/\s+/g,' ').trim()});
}
function sameAns(inp,answers){var A={};answers.forEach(function(a){expand(a).forEach(function(x){A[x]=1})});return expand(inp).some(function(x){return A[x]})}

function words(s){return expand(s)[0].split(' ').filter(Boolean)}
function lcsT(a,b){var d=[],i,j;for(i=0;i<=a.length;i++){d[i]=[];for(j=0;j<=b.length;j++)d[i][j]=i&&j?(a[i-1]==b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1])):0}return d}
function sim(x,y){var a=words(x),b=words(y);if(!a.length||!b.length)return 0;return 2*lcsT(a,b)[a.length][b.length]/(a.length+b.length)}
function diffH(correct,inp){
var raw=correct.split(' '),a=raw.map(function(w){return norm(w)}),b=norm(inp).split(' ').filter(Boolean),d=lcsT(a,b),hit={},i=a.length,j=b.length;
while(i&&j){if(a[i-1]==b[j-1]){hit[i-1]=1;i--;j--}else if(d[i-1][j]>=d[i][j-1])i--;else j--}
return raw.map(function(w,k){return hit[k]||!a[k]?esc(w):'<span class="wbad">'+esc(w)+'</span>'}).join(' ');
}

function checkF(give){
var x=Q.x,a2=E('a2'),a3=E('a3');
if(!give&&!a2.value.trim()&&!a3.value.trim()){a2.focus();return}
var okA=function(inp,ans){var al=ans.toLowerCase().split('/'),ps=norm(inp.replace(/,/g,' ')).split(/[\s\/]+/).filter(Boolean);return ps.length>0&&ps.every(function(p){return al.indexOf(p)>-1})};
var o2=!give&&okA(a2.value,x.p2),o3=!give&&okA(a3.value,x.p3),ok=o2&&o3,was=learned(x.v);
[[a2,o2,'f2',x.p2],[a3,o3,'f3',x.p3]].forEach(function(z){z[0].classList.add(z[1]?'good':'bad');z[0].readOnly=true;z[0].blur();E(z[2]).textContent=z[1]?'':'→ '+z[3]});
grade('f',Q.id,ok);after(ok,give?'не знаю':(a2.value.trim()||'—')+' / '+(a3.value.trim()||'—'));
E('res').innerHTML='<div class="exp"><span class="'+(ok?'okt':'badt')+'">'+(ok?(!was&&learned(x.v)?'Верно! Глагол выучен ✓':'Верно!'):'Запомни:')+'</span><div class="f mono"><span class="k1">'+x.v+'</span> – <span class="k2">'+x.p2+'</span> – <span class="k3">'+x.p3+'</span></div>'+fixedLine()+goalLine()+'</div>';
markDone();sayForms(x);
}
function checkQ(give){

var inp=E('ans'),v=inp.value;

inp.classList.add(ok?'good':'bad');inp.readOnly=true;inp.blur();
if(Q.m=='c')grade('c',Q.id,ok);else if(Q.m=='t')tsAdd(Q.ti,ok);

else{var b=build(Q.f,Q.i,Q.p,Q.x.v);body='<div class="f mono">'+fh(b,KD[Q.i&3][1],tag(Q.f,Q.i,Q.p,Q.x.v))+'</div><div class="g">'+tname(Q.i)+' — '+gl(Q.f,Q.i,Q.x.v)+'</div>'}

function doMic(){

/* =========== СЕГОДНЯ: занятие =========== */
function kindOf(x){return x.m}
function interleave(a){
shuffle(a);
for(var r=0;r<3;r++)for(var i=1;i<a.length;i++)if(kindOf(a[i])==kindOf(a[i-1]))for(var j=i+1;j<a.length;j++)if(kindOf(a[j])!=kindOf(a[i-1])){var t=a[i];a[i]=a[j];a[j]=t;break}
return a;
}
function buildPlan(){
var t=today(),plan=[],cf=ses.cf;ses.cf=null;
var due=function(d,n){return shuffle(deckIds(d).filter(function(id){var r=st.srs[id];return r&&r.d<=t})).slice(0,n)};
var fresh=function(d,n){var o=nt(d);return deckIds(d).filter(function(id){return !st.srs[id]}).slice(0,Math.max(0,Math.min(n,o.lim-o.n)))};
due('f',3).forEach(function(id){plan.push({m:'f',sub:'type',id:id})});
due('c',3).forEach(function(id){plan.push({m:'c',sub:'fill',id:id})});
fresh('f',2).forEach(function(id){plan.push({m:'f',id:id,intro:1})});
fresh('c',2).forEach(function(id){plan.push({m:'c',id:id,intro:1})});
ses.cf=cf;
var dueKeys={};plan.forEach(function(p){if(p.id)dueKeys[p.id]=1});
st.err.filter(function(e){return errSpec(e)&&!(e.kind=='f'&&dueKeys['f:'+e.ref.v])&&!(e.kind=='c'&&dueKeys[e.ref.id])}).sort(function(a,b){return a.d-b.d}).slice(0,3).forEach(function(e){plan.push({m:'e',key:e.key})});
var sp=sentPool();
if(TTS)shuffle(sp.slice()).slice(0,2).forEach(function(s){plan.push({m:'d',s:s.key})});
var seenS=sp.filter(function(s){return st.srs[s.key]}),src=seenS.length>=2?seenS:sp;
shuffle(src.slice()).slice(0,2).forEach(function(s){plan.push({m:'say',s:s.key})});
['mark','type','choose'].forEach(function(s){plan.push({m:'t',sub:s})});
while(plan.length<12)plan.push({m:'t',sub:['mark','type','choose'][rnd(3)]});
plan=interleave(plan);
/* знакомство с новым — ближе к началу */
plan.sort(function(a,b){return (b.intro?1:0)-(a.intro?1:0)});
var intros=plan.filter(function(p){return p.intro}),rest=plan.filter(function(p){return !p.intro}),out=[];
while(intros.length||rest.length){if(intros.length)out.push(intros.shift());if(rest.length)out.push(rest.shift());if(rest.length&&!intros.length)out=out.concat(rest.splice(0))}
return out;
}
function startSession(){SS={plan:SPEND||buildPlan(),i:-1,ok:0,all:0,added:0};SPEND=null;advance()}
function advance(){
while(++SS.i<SS.plan.length){var q=makeQ(SS.plan[SS.i]);if(q&&!((q.m=='f'||q.m=='c')&&!q.id)){q.ses=1;Q=q;drawQ();if(Q.m=='d')say(Q.full);focusIn();return}}
SS.over=1;Q=null;drawSummary();
}
function drawSummary(){
var n=dayN(),s=streakNow();
$('#out-s').innerHTML='<div class="card"><div class="big">Занятие закончено 🎉</div><div class="g" style="margin-top:10px">Верно: <b style="color:var(--tx)">'+SS.ok+' из '+SS.all+'</b>.<br>'+
(SS.added?'Новых ошибок в журнале: '+SS.added+'. Они вернутся в следующих занятиях, пока не закрепятся.':'Новых ошибок нет — отлично!')+'<br>Сегодня: '+n+' из '+GOAL+(n>=GOAL?' ✓':'')+' · 🔥 '+s+' '+plural(s,DW)+' подряд.</div>'+
'<div class="btns">'+(st.err.length?'<button data-a="toerr">Разобрать ошибки</button>':'')+'<button data-a="again" class="pri">Ещё занятие</button></div></div>';
}
function renderS(){
$('#slv').innerHTML='<span class="lab">Мой уровень</span>'+['A1','A2','B1'].map(function(l){return '<button data-lv="'+l+'" class="'+(st.level==l?'on':'')+'">'+(l=='B1'?'B1+':l)+'</button>'}).join('');
drawDay();
if(SS&&!SS.over&&Q&&Q.ses){drawQ();return}
if(SS&&SS.over){drawSummary();return}
var p=SPEND=buildPlan(),c={rv:0,nw:0,e:0,t:0,d:0,say:0};
p.forEach(function(x){if(x.m=='f'||x.m=='c')c[x.intro?'nw':'rv']++;else c[x.m]++});
var items=[['🔁','повторить',c.rv],['✨','новое',c.nw],['⚠️','ошибки',c.e],['◷','времена',c.t],['🎧','диктант',c.d],['🎤','говорение',c.say]].filter(function(x){return x[2]});
var h='<div class="card"><div class="lbl">'+(dayN()>=GOAL?'Цель на сегодня выполнена ✓ — можно ещё':'Занятие на сегодня · примерно 10 минут')+'</div><div class="big" style="margin-top:6px">'+p.length+' '+plural(p.length,['задание','задания','заданий'])+'</div>'+
'<div class="plan">'+items.map(function(x){return '<span>'+x[0]+' '+x[1]+': <b>'+x[2]+'</b></span>'}).join('')+'</div>'+
'<div class="btns"><button data-a="start" class="pri">▶ Начать</button></div></div>';
if(st.err.length)h+='<div class="card"><div class="qh"><div><div class="lbl">Журнал ошибок</div><div class="sent" style="margin-top:4px">'+st.err.length+' '+plural(st.err.length,['задание','задания','заданий'])+'</div></div><button data-a="toerr">Разобрать →</button></div></div>';
h+='<div class="card"><div class="lbl">Уровень '+(st.level=='B1'?'B1+':st.level)+'</div><div class="g" style="margin-top:6px">'+LC().d+'</div></div>';
h+='<div class="card"><div class="lbl">Как заниматься</div><ul class="tips"><li>Произноси каждый ответ вслух — даже когда печатаешь.</li><li>Лучше 10 минут каждый день, чем час раз в неделю.</li><li>Ошибки — это нормально: они попадают в журнал и возвращаются, пока не закрепятся.</li><li>Слушай английский каждый день: 10–15 минут простых видео или подкастов для начинающих.</li></ul></div>';
$('#out-s').innerHTML=h;
}
$('#slv').addEventListener('click',function(e){var b=e.target.closest('[data-lv]');if(!b)return;st.level=b.getAttribute('data-lv');st.lvl=LEVELS[st.level].f;SPEND=null;TQ=null;if(SS&&SS.over)SS=null;save();renderS()});

go(st.tab);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
